<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AP Assure App</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a phone frame centred on the page; screens stack inside it, tab bar floats at the bottom of tab screens. */
:root{
  --orange:#EE6A1F; --orange-deep:#C9500F; --orange-soft:#FDE6D3; --orange-tint:#FFF1E4;
  --navy:#16264A; --navy-soft:#3B4A6B; --cream:#FCF5EA; --card:#FFFDF9; --line:#EFE2D0;
  --green:#2F8F5B; --green-soft:#DDF1E4; --blue:#2D5BD0; --blue-soft:#E1EAFB; --red:#C23B2E;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:#E9DFCF;color:var(--navy);font-family:var(--font);font-size:14px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:grid;place-items:center;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phone{position:relative;width:390px;max-width:100%;height:min(844px,100%);background:var(--cream);border:10px solid #14233f;border-radius:46px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(22,38,74,.45),0 0 0 2px #2b3c61}
.notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:26px;background:#14233f;border-radius:0 0 18px 18px;z-index:60}
.sb{position:absolute;top:0;left:0;right:0;height:44px;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-weight:700;font-size:12px;z-index:55;pointer-events:none}
.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--cream);padding-top:44px}
.screen.on{display:flex;animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.body{flex:1;overflow-y:auto;padding:6px 18px 22px;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
.tabpad{padding-bottom:92px}
.top{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 8px;min-height:44px}
.top h2{margin:0;font-size:16px;font-weight:700}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:50%}
.ib:active{background:var(--orange-soft)}
.btn{display:flex;align-items:center;justify-content:space-between;width:100%;padding:16px 20px;border-radius:16px;background:var(--orange);color:#fff;font-weight:700;font-size:15px;box-shadow:0 8px 18px -8px rgba(238,106,31,.8);transition:transform .15s,filter .15s}
.btn:active{transform:scale(.98)}
.btn[disabled]{background:#E6D8C6;color:#A7957E;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:var(--card);color:var(--navy);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:12px 16px;font-size:13px;border-radius:13px}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.wm{font-weight:800;letter-spacing:-.5px;font-size:20px;color:#B3261E}
.wm i{font-style:normal;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px}
.pill.o{background:var(--orange-soft);color:var(--orange-deep)} .pill.g{background:var(--green-soft);color:var(--green)} .pill.b{background:var(--blue-soft);color:var(--blue)} .pill.n{background:#EDE6DA;color:var(--navy-soft)}
/* splash */
#splash{padding:0;background:var(--cream);align-items:center;justify-content:center;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(1px)}
.sp-mark{position:relative;text-align:center;z-index:2}
.sp-mark .wm{font-size:38px}
.sp-mark p{margin:8px 0 0;color:var(--navy-soft);font-weight:500}
.sp-ring{width:84px;height:84px;margin:0 auto 14px;border-radius:50%;border:10px solid var(--orange);border-right-color:#7A3FB0;border-bottom-color:#B3261E;animation:spin 3s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* home */
.hero{position:relative;padding:6px 0 4px;min-height:190px}
.hero h1{margin:6px 0 8px;font-size:27px;line-height:1.1;font-weight:800;max-width:11ch;letter-spacing:-.5px;text-wrap:balance}
.hero p{margin:0;color:var(--navy-soft);font-weight:500;max-width:15ch;line-height:1.35}
.hero svg.house{position:absolute;right:-18px;top:0;width:190px}
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#F37A2E,#E85C14);color:#fff;border-radius:20px;padding:14px;box-shadow:0 12px 24px -12px rgba(238,106,31,.9);margin:10px 0 12px}
.cta .ic{width:52px;height:52px;border-radius:50%;background:#fff;color:var(--orange);display:grid;place-items:center;flex:none}
.cta .ic svg{width:26px;height:26px}
.cta b{display:block;font-size:16px} .cta small{opacity:.9;font-size:12px}
.cta .ch{margin-left:auto}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:10px;text-align:left;padding:14px;position:relative;font-weight:600;line-height:1.25}
.tile .tic{width:38px;height:38px;border-radius:10px;background:#E8EEF8;color:var(--navy-soft);display:grid;place-items:center}
.tile .bd{position:absolute;right:12px;top:12px;background:var(--orange);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.promo{display:flex;align-items:center;gap:12px;margin-top:12px;padding:0;overflow:hidden;width:100%;text-align:left}
.promo .pv{width:112px;height:84px;background:linear-gradient(160deg,#A9D4B0,#6FA77C);position:relative;flex:none}
.promo b{font-size:13px;line-height:1.3;display:block;max-width:14ch}
.promo .ch{margin-left:auto;margin-right:12px;width:28px;height:28px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.tabbar{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:none;justify-content:space-around;padding:8px 6px 14px;z-index:30}
.tabbar.on{display:flex}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:#6B7690;padding:4px 14px;border-radius:12px}
.tabbar button.on{color:var(--orange)}
/* stepper */
.steps{display:flex;align-items:flex-start;justify-content:space-between;padding:4px 22px 6px;position:relative}
.steps::before{content:"";position:absolute;left:44px;right:44px;top:15px;height:2px;background:var(--line)}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;font-weight:600;color:#8791A8;z-index:1;width:60px}
.st .dot{width:22px;height:22px;border-radius:50%;background:var(--cream);border:2px solid var(--line);display:grid;place-items:center;color:#fff;margin-top:4px}
.st .dot svg{width:12px;height:12px;stroke-width:3}
.st.done .dot{background:var(--orange);border-color:var(--orange)}
.st.cur .dot{background:var(--card);border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.st.cur .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--orange)}
.st.cur,.st.done{color:var(--navy)}
/* camera */
.foot{padding:10px 18px 18px;background:linear-gradient(180deg,rgba(252,245,234,0),var(--cream) 28%)}
.vf{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1/.78;background:#2A2118}
.vf img{width:100%;height:100%;object-fit:cover;transition:transform .35s}
.vf .empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#E9D9C2;padding:30px;line-height:1.4}
.vf .cn{position:absolute;width:34px;height:34px;border:3px solid #fff;opacity:.95}
.cn.a{left:14px;top:14px;border-right:0;border-bottom:0;border-radius:12px 0 0 0}.cn.b{right:14px;top:14px;border-left:0;border-bottom:0;border-radius:0 12px 0 0}
.cn.c{left:14px;bottom:14px;border-right:0;border-top:0;border-radius:0 0 0 12px}.cn.d{right:14px;bottom:14px;border-left:0;border-top:0;border-radius:0 0 12px 0}
.zoom{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(22,38,74,.55);padding:4px;border-radius:99px;backdrop-filter:blur(6px)}
.zoom button{min-width:34px;height:30px;border-radius:99px;color:#fff;font-size:12px;font-weight:700}
.zoom button.on{background:var(--orange)}
.thumbs{display:flex;gap:10px;margin:12px 0}
.th{position:relative;flex:1;aspect-ratio:1;border-radius:12px;overflow:hidden;border:2px solid transparent;background:#EFE4D3}
.th.sel{border-color:var(--orange)}
.th img{width:100%;height:100%;object-fit:cover}
.th.add{border:2px dashed #CDBBA2;display:grid;place-items:center;color:#8A7A66;background:transparent}
.th .rm{position:absolute;right:3px;top:3px;width:20px;height:20px;border-radius:50%;background:rgba(22,38,74,.75);color:#fff;display:grid;place-items:center}
.th .rm svg{width:11px;height:11px;stroke-width:3}
.shutter{display:block;margin:6px auto 12px;width:76px;height:76px;border-radius:50%;border:4px solid var(--orange);padding:5px;background:transparent}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--orange);transition:transform .12s}
.shutter:active span{transform:scale(.88)}
.link{color:var(--orange-deep);font-weight:700;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.h3{font-weight:700;margin:4px 0 2px;font-size:15px}.sub{color:var(--navy-soft);font-size:12.5px;line-height:1.4;margin:0 0 10px}
/* details */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 16px}
.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.fl{display:block;font-weight:700;font-size:13px;margin-top:6px}
.inp{width:100%;margin-top:6px;padding:13px 14px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);outline:0}
.inp:focus{border-color:var(--orange)}
textarea.inp{resize:none;height:80px}
/* analysis */
.scan{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:1/1.05;background:#2A2118}
.scan img{width:100%;height:100%;object-fit:cover}
.scan::after{content:"";position:absolute;left:0;right:0;height:70px;top:-70px;background:linear-gradient(180deg,transparent,rgba(238,106,31,.55));border-bottom:2px solid #FFB07A;animation:sc 1.7s linear infinite}
@keyframes sc{to{top:100%}}
.scan.done::after{display:none}
.stat{margin:14px 0;text-align:center;font-weight:700}
.stat small{display:block;font-weight:500;color:var(--navy-soft);margin-top:4px;min-height:18px}
.bar{height:6px;border-radius:4px;background:#E7DCCB;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--green);border-radius:4px;transition:width 1s ease}
.res{display:flex;gap:0;overflow:hidden;position:relative}
.res .rp{width:42%;position:relative;flex:none;min-height:150px}
.res .rp img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}
.res .rp svg{position:absolute;inset:0;width:100%;height:100%}
.res .rt{padding:12px 13px;flex:1;min-width:0}
.res .rt b.big{display:block;font-size:17px;line-height:1.2;margin:6px 0 10px}
.seen{display:flex;align-items:center;gap:12px;padding:10px 4px;font-size:13px;font-weight:500}
.seen .si{width:34px;height:34px;border-radius:50%;background:#E8EEF8;color:var(--navy-soft);display:grid;place-items:center;flex:none}
.rec{background:var(--orange-tint);border:1px solid #F8D2B3;border-radius:18px;padding:12px;margin-top:10px}
.rec .rh{display:flex;gap:8px;align-items:center;color:var(--orange-deep);font-weight:800;font-size:13px}
.rec p{margin:6px 0 12px;font-size:12.5px;color:var(--navy-soft);line-height:1.4}
.note{font-size:11.5px;color:var(--navy-soft);line-height:1.4;margin:10px 2px 0;display:flex;gap:6px}
.note svg{width:14px;height:14px;margin-top:1px}
/* next */
.nx-hero{border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#F3E6D2,#EAD9BF);height:178px;position:relative}
.nx-hero svg{width:100%;height:100%}
.nx-t{font-size:22px;font-weight:800;margin:16px 0 4px;letter-spacing:-.3px}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;font-weight:600;font-size:13px;margin-top:9px}
.row svg{color:var(--navy-soft)}
/* book */
.seg{display:grid;grid-template-columns:1fr 1fr;background:#EFE4D3;border-radius:14px;padding:4px;gap:4px;margin:8px 0 14px}
.seg button{padding:10px 6px;border-radius:11px;font-weight:700;font-size:13px;color:var(--navy-soft)}
.seg button.on{background:var(--card);color:var(--navy);box-shadow:0 2px 6px rgba(22,38,74,.12)}
.dates{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.dates::-webkit-scrollbar{display:none}
.dt{flex:none;width:56px;padding:10px 0;border-radius:15px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-weight:700}
.dt small{display:block;font-size:11px;color:var(--navy-soft);font-weight:600}.dt b{font-size:18px}
.dt.on{background:var(--orange);border-color:var(--orange);color:#fff}.dt.on small{color:#FFE2CC}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 14px}
.slot{padding:12px;border-radius:13px;border:1.5px solid var(--line);background:var(--card);font-weight:700;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.slot.on{border-color:var(--orange);background:var(--orange-tint);color:var(--orange-deep)}
.slot[disabled]{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.sum{padding:12px 14px;font-size:12.5px;line-height:1.5;color:var(--navy-soft);margin-bottom:14px}
.sum b{color:var(--navy)}
/* cases */
.cc{display:flex;gap:12px;padding:12px;margin-bottom:12px;width:100%;text-align:left;align-items:center}
.cc .cp{width:62px;height:62px;border-radius:13px;overflow:hidden;flex:none;background:#EFE4D3}
.cc .cp img{width:100%;height:100%;object-fit:cover}
.cc .ct{flex:1;min-width:0}.cc b{display:block;font-size:14px;margin-bottom:2px}
.cc small{color:var(--navy-soft);font-size:11.5px;display:block;margin-bottom:6px}
.prog{display:flex;gap:3px;margin-top:8px}.prog i{flex:1;height:4px;border-radius:2px;background:#E7DCCB}.prog i.f{background:var(--orange)}.prog.ok i.f{background:var(--green)}
.cs{display:flex;gap:14px;padding:14px;align-items:center;margin-bottom:14px}
.cs .cp{width:76px;height:76px;border-radius:15px;overflow:hidden;flex:none}.cs .cp img{width:100%;height:100%;object-fit:cover}
.cs b{font-size:16px;display:block;margin:4px 0 2px}.cs small{color:var(--navy-soft)}
.tl{padding:6px 16px;margin-bottom:14px}
.tls{display:flex;gap:14px;position:relative;padding:11px 0}
.tls:not(:last-child)::before{content:"";position:absolute;left:11px;top:33px;bottom:-11px;width:2px;background:var(--line)}
.tls.done:not(:last-child)::before{background:var(--orange)}
.tls .d{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none;color:#fff;z-index:1}
.tls.done .d{background:var(--orange);border-color:var(--orange)}.tls.cur .d{border-color:var(--orange);box-shadow:0 0 0 4px var(--orange-soft)}
.tls .d svg{width:12px;height:12px;stroke-width:3}
.tls b{font-size:13px;display:block}.tls small{color:var(--navy-soft);font-size:11.5px}
.tls.pend b{color:#8791A8}
/* warranty */
.flip{perspective:1000px;margin-bottom:12px}
.fi{position:relative;transition:transform .6s;transform-style:preserve-3d;height:318px}
.flip.back .fi{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;overflow:hidden;background:var(--card);border:1.5px solid #F1C9A6;box-shadow:0 14px 26px -16px rgba(201,80,15,.7)}
.face.bk{transform:rotateY(180deg);background:#F7F2EA}
.wh{background:linear-gradient(135deg,#F37A2E,#E0540F);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.wh small{font-weight:600;opacity:.9}
.wb{display:flex;gap:14px;padding:16px;align-items:center}
.qr{width:128px;height:128px;flex:none;padding:8px;background:#fff;border-radius:12px;border:1px solid var(--line);cursor:pointer;position:relative}
.qr svg{width:100%;height:100%;display:block}
.wy b{display:block;font-size:34px;line-height:1;color:var(--navy);letter-spacing:-1px}.wy b small{font-size:14px;letter-spacing:0;margin-left:4px}
.wy span{display:block;font-size:12px;color:var(--navy-soft);margin-top:6px;line-height:1.4}
.ticks{padding:0 16px 12px;display:grid;gap:5px;font-size:12.5px;font-weight:600}
.ticks div{display:flex;gap:8px;align-items:center}.ticks svg{width:15px;height:15px;color:var(--green);stroke-width:3}
.wf{display:flex;justify-content:space-between;align-items:center;padding:0 16px 14px;font-size:11.5px;color:var(--navy-soft);font-weight:600}
.wf em{font-style:normal;color:var(--orange-deep);font-weight:800}
.locked{padding:18px;text-align:center;margin-bottom:12px;border-style:dashed}
.locked .lq{width:96px;height:96px;margin:0 auto 10px;background:repeating-conic-gradient(#E9DDCB 0 25%,transparent 0 50%) 0 0/16px 16px;border-radius:12px;opacity:.7}
.lock-t{font-weight:800;margin-bottom:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.claim{padding:14px;margin-bottom:14px}
.claim h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;align-items:center}
/* sheet & toast */
.sheet{position:absolute;inset:0;background:rgba(22,38,74,.5);z-index:80;display:none;align-items:flex-end}
.sheet.on{display:flex;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sh{background:var(--cream);width:100%;border-radius:26px 26px 0 0;padding:16px 18px 24px;max-height:86%;overflow-y:auto;animation:up .3s ease}
@keyframes up{from{transform:translateY(40px)}}
.sh h3{margin:0 0 4px;font-size:18px}
.log{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-top:8px;font-size:13px;font-weight:600}
.log svg{color:var(--green);stroke-width:3;width:16px;height:16px}.log small{margin-left:auto;color:var(--navy-soft);font-weight:600}
.toast{position:absolute;left:18px;right:18px;top:54px;background:var(--navy);color:#fff;padding:12px 14px;border-radius:14px;z-index:90;font-weight:600;font-size:13px;opacity:0;transform:translateY(-12px);pointer-events:none;transition:.28s}
.toast.on{opacity:1;transform:none}
.ok-ring{width:72px;height:72px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:6px auto 12px}
.ok-ring svg{width:34px;height:34px;stroke-width:3}
.center{text-align:center}
.learn{padding:14px;margin-bottom:12px}.learn b{display:block;margin-bottom:4px}.learn p{margin:0;color:var(--navy-soft);font-size:12.5px;line-height:1.45}
.clc{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:10px 0}
.clic{width:38px;height:38px;border-radius:12px;background:var(--orange-soft);color:var(--orange-deep);display:grid;place-items:center;flex:none}
.clt{flex:1;min-width:0}.clt b{display:block;font-size:14px;margin:1px 0}.clt small{display:block;color:var(--navy-soft);font-size:11.5px;line-height:1.35}
.hint{font-size:12px;color:var(--navy-soft);line-height:1.4;margin:-4px 2px 12px}
.pts{padding:16px;margin:8px 0 14px;background:linear-gradient(135deg,#1B2D58,#16264A);color:#fff;border:0}
.pts small{opacity:.82;font-size:12px;display:block}
.pts .pn{font-size:38px;font-weight:800;letter-spacing:-1px;line-height:1.15;display:flex;align-items:center;gap:8px;margin-top:6px}
.pts .pn svg{width:28px;height:28px;color:#FFB07A;fill:#FFB07A}
.pts .ps{display:flex;gap:20px;margin-top:12px;font-size:11.5px;opacity:.95}.pts .ps b{display:block;font-size:17px}

function rng(s){return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646}}
function drawScene(kind,w=480,h=560){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const r=rng(kind.length*977+kind.charCodeAt(0)*31);
  const blot=(x,y,rad,col,a)=>{const gr=g.createRadialGradient(x,y,0,x,y,rad);gr.addColorStop(0,`rgba(${col},${a})`);gr.addColorStop(1,`rgba(${col},0)`);g.fillStyle=gr;g.beginPath();g.arc(x,y,rad,0,7);g.fill()};
  const speck=(x0,y0,spread,n,col)=>{for(let i=0;i<n;i++){const x=x0+(r()-.5)*spread,y=y0+(r()-.5)*spread*.7;g.fillStyle=`rgba(${col},${.25+r()*.45})`;g.beginPath();g.arc(x,y,1+r()*3.2,0,7);g.fill()}};
  if(kind==='ceiling'){
    g.fillStyle='#e0d1b7';g.fillRect(0,0,w,h);
    g.fillStyle='#f1e8d8';g.beginPath();g.moveTo(0,0);g.lineTo(w,0);g.lineTo(w,h*.2);g.lineTo(w*.45,h*.38);g.lineTo(0,h*.22);g.fill();
    g.fillStyle='#d8c7ab';g.beginPath();g.moveTo(w*.45,h*.38);g.lineTo(w,h*.2);g.lineTo(w,h);g.lineTo(w*.45,h);g.fill();
    const sk=g.createLinearGradient(0,h*.3,0,h*.75);sk.addColorStop(0,'#bcd9ef');sk.addColorStop(1,'#eaf3f9');g.fillStyle='#8f7a5a';g.fillRect(w*.8,h*.3,w*.2,h*.5);g.fillStyle=sk;g.fillRect(w*.83,h*.33,w*.17,h*.44);
    g.strokeStyle='rgba(90,70,45,.35)';g.lineWidth=2;g.beginPath();g.moveTo(w*.45,h*.38);g.lineTo(w*.45,h);g.stroke();
    for(let i=0;i<9;i++){blot(w*.45+(r()-.5)*w*.5,h*.3+r()*h*.16,50+r()*70,'122,86,38',.28)}
    for(let i=0;i<6;i++){blot(w*.45+(r()-.3)*w*.3,h*.38+r()*h*.22,35+r()*45,'110,80,40',.22)}
    speck(w*.42,h*.3,w*.45,150,'38,28,18');speck(w*.5,h*.4,w*.2,60,'38,28,18');
  }else if(kind==='joint'){
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#a6a39b');gr.addColorStop(1,'#8d8a82');g.fillStyle=gr;g.fillRect(0,0,w,h);
    for(let y=0;y<h;y+=3){g.fillStyle=`rgba(255,255,255,${r()*.05})`;g.fillRect(0,y,w,1)}
    g.fillStyle='#6f6c65';g.fillRect(0,h*.42,w,h*.05);
    for(let i=0;i<14;i++){const x=r()*w;blot(x,h*.5,20+r()*28,'60,50,38',.4);g.fillStyle='rgba(45,40,32,.35)';g.fillRect(x-3,h*.47,6,h*(.1+r()*.35))}
    g.strokeStyle='#2a2620';g.lineWidth=3;g.beginPath();g.moveTo(w*.1,h*.44);for(let x=w*.1;x<w*.9;x+=24)g.lineTo(x,h*.44+(r()-.5)*10);g.stroke();
    speck(w*.5,h*.5,w*.8,110,'30,26,20');
  }else if(kind==='terrace'){
    const sk=g.createLinearGradient(0,0,0,h*.35);sk.addColorStop(0,'#9fc4e3');sk.addColorStop(1,'#dcebf5');g.fillStyle=sk;g.fillRect(0,0,w,h);
    g.fillStyle='#b9b2a4';g.fillRect(0,h*.33,w,h*.67);g.fillStyle='#8c8678';g.fillRect(0,h*.3,w,h*.1);
    for(let x=0;x<w;x+=60){g.fillStyle='rgba(0,0,0,.08)';g.fillRect(x,h*.4,2,h*.6)}
    for(let i=0;i<5;i++)blot(w*(.2+r()*.6),h*(.55+r()*.35),50+r()*60,'70,90,60',.38);
    blot(w*.5,h*.7,110,'60,50,40',.25);g.fillStyle='rgba(60,45,30,.5)';g.fillRect(w*.1,h*.4,w*.8,3);
  }else if(kind==='bathroom'){
    g.fillStyle='#e6e0d3';g.fillRect(0,0,w,h);g.strokeStyle='rgba(120,110,95,.45)';g.lineWidth=2;
    for(let x=0;x<=w;x+=60){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke()}for(let y=0;y<=h;y+=60){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke()}
    for(let i=0;i<10;i++)blot(w*.3+r()*w*.2,i*h*.1,40+r()*30,'150,110,60',.3);speck(w*.35,h*.25,w*.35,90,'60,45,30');
    g.fillStyle='#fff';g.globalAlpha=.7;for(let i=0;i<20;i++){g.fillRect(w*.3+r()*w*.25,h*.5+r()*h*.4,2+r()*6,2+r()*3)}g.globalAlpha=1;
  }else{
    const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#9b9a96');gr.addColorStop(1,'#6c6b68');g.fillStyle=gr;g.fillRect(0,0,w,h);
    for(let i=0;i<18;i++)blot(r()*w,h*(.35+r()*.6),30+r()*60,'235,235,230',.4);blot(w*.5,h*.95,w*.7,'35,38,40',.55);
    g.fillStyle='rgba(30,30,30,.35)';g.fillRect(0,h*.62,w,2);speck(w*.5,h*.8,w*.9,120,'20,22,24');
  }
  const v=g.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.28)');g.fillStyle=v;g.fillRect(0,0,w,h);
  return c;
}

R.dealer=()=>{const id=S.dealer||S.clinic||'c1';S.dealer=id;const k=CLINICS[id];const L=ledger(id);const mine=cases.filter(c=>(c.clinic||'c1')===id);
 const leads=mine.filter(c=>!c.accepted);const xs=mine.filter(c=>c.xsell&&!c.xsellDone&&c.stage>=6);const warr=mine.filter(c=>c.stage>=6).length;
 $('#dealer').innerHTML=`${topbar('Dealer view','home')}<div class="body">
  <span class="fl" style="margin-top:0">Viewing as</span>
  <div class="chips" style="margin:6px 0 4px">${Object.keys(CLINICS).map(i=>`<button class="chip ${i===id?'on':''}" data-act="dealerpick:${i}">${esc(CLINICS[i].short)}</button>`).join('')}</div>
  <div class="card pts"><small>${esc(k.name)} · AP Assure Clinic</small><span class="pn">${ic('star')}${L.total}</span><small>Assure Points credited</small>
   <div class="ps"><span><b>${mine.length}</b>Cases from the app</span><span><b>${warr}</b>Warranties issued</span><span><b>${L.out.length}</b>Credits</span></div></div>
  <p class="h3">New leads from the app</p>
  ${leads.length?leads.map(c=>`<div class="card lead"><h4>${esc(c.title)}</h4><p>${esc(c.cust||'Customer')} · ${c.vt==='home'?'Home visit by your technician':'Visit at your clinic'} · ${esc((c.dates&&c.dates[1])||'')}<br>${esc(c.id)} · AI first read attached</p>
    <span class="fl" style="margin-top:0;font-size:12px">Assign technician</span>
    <div class="chips">${k.techs.map(n=>`<button class="chip ${(c.tech||k.techs[0])===n?'on':''}" data-act="techpick:${c.id}:${n}">${esc(n)}</button>`).join('')}</div>
    <button class="btn sm" data-act="accept:${c.id}">Accept lead · +${PTS.lead} points ${ic('check')}</button></div>`).join(''):`<div class="card lead"><p style="margin:0">No new leads. Bookings made in the app for this clinic appear here.</p></div>`}
  <p class="h3" style="margin-top:14px">Cross-sell leads</p>
  ${xs.length?xs.map(c=>`<div class="card lead"><h4>${esc(c.xsell)}</h4><p>Flagged by your technician on ${esc(c.id)} · ${esc(c.cust||'Customer')}</p><button class="btn sm" data-act="xs:${c.id}">Follow up · +${PTS.xsell} points ${ic('check')}</button></div>`).join(''):`<div class="card lead"><p style="margin:0">None right now. Technicians flag adjacent needs when a warranty is issued.</p></div>`}
  <p class="h3" style="margin-top:14px">Points credited</p>
  ${L.out.slice(0,12).map(o=>`<div class="card pl">${ic('check')}<span>${esc(o.l)}<small>${esc(o.id)}</small></span><em>+${o.p}</em></div>`).join('')||'<p class="sub">No points yet.</p>'}
  <div class="note">${ic('info')}<span>Points are credited at each milestone. How points convert to rewards is decided by Asian Paints. Illustrative schedule for the prototype.</span></div>
 </div>`};

/* ---------- actions ---------- */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').classList.add('on')}
const closeSheet=()=>$('#sheet').classList.remove('on');
function jobLog(c){const t=TIERS[c.tier];const rows=[['Accountable clinic',clOf(c).short],['Technician',c.tech||clOf(c).techs[0]],['Surface prepared','09:10'],['Primer applied, cured 6 h','11:40'],['Coat 1 applied','16:05'],['Coat 2 applied','Next day 10:20'],['Flood test, 24 h: passed','Day 3 10:45']];
 openSheet(`<h3>Job log · ${esc(c.id)}</h3><p class="sub">${esc(t.name)} · ${esc(c.area)}. Each stage is logged with a photo and a time stamp.</p>${rows.map(r=>`<div class="card log">${ic('check')}${r[0]}<small>${r[1]}</small></div>`).join('')}<div class="card log" style="margin-bottom:14px">${ic('drop')}Moisture after test<small>11%</small></div><button class="btn" data-act="closesheet">Close</button>`)}
function addPhoto(file){if(!file)return;const url=URL.createObjectURL(file);S.photos.push({url,blob:file,demo:false});S.sel=S.photos.length-1;R.photos()}
$('#file').onchange=e=>{const f=e.target.files&&e.target.files[0];e.target.value='';if(S.photos.length>=3){toast('You can add up to 3 photos');return}addPhoto(f)};
function newCase(){const d=S.draft,days=dayList();const n=String(500+Math.floor(Math.random()*400));const r=S.result&&S.result.ok?S.result:null;
 const tk=tierKey(r?r.system:'');const scene=S.ctx.where==='Bathroom'?'bathroom':S.ctx.where==='Basement'?'basement':S.ctx.where==='Terrace'?'terrace':'ceiling';
 const thumb=S.photos[0]?null:thumbOf(scene);
 const mk=thumbUrl=>{const kk=CLINICS[S.clinic];const c={clinic:S.clinic,tech:kk.techs[0],cust:d.name.trim(),vt:d.type,accepted:false,id:'AP-2026-0'+n,title:r?r.cause:'Site inspection request',where:`${S.ctx.where} · ${S.ctx.floor}`,stage:1,scene,tier:tk,issued:'',valid:'',area:S.ctx.where+' area',dates:[new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'}),fmtD(days[d.date]).replace(/^\w+, /,'')+' · '+SLOTS[d.slot],'','','','',''],thumb:thumbUrl};cases.unshift(c);saveCases();S.openCase=c.id;S.photos=[];S.sel=0;S.result=null;
  openSheet(`<div class="center"><div class="ok-ring">${ic('check')}</div><h3>Visit booked</h3><p class="sub">Case ${esc(c.id)} is with ${esc(kk.name)}, who will confirm it. ${d.type==='home'?esc(kk.techs[0])+' from your clinic visits you':'Your clinic will see you'} on ${esc(fmtD(days[d.date]))}, ${SLOTS[d.slot]}.</p></div><button class="btn" data-act="viewcase">View your case ${ic('right')}</button>`)};
 if(S.photos[0]){const im=new Image();im.onload=()=>{const cv=document.createElement('canvas');cv.width=240;cv.height=240;cv.getContext('2d').drawImage(im,0,0,240,240);mk(cv.toDataURL('image/jpeg',.7))};im.onerror=()=>mk(thumbOf(scene));im.src=S.photos[0].url}else mk(thumb)}
function advance(id){const c=cases.find(x=>x.id===id);if(!c)return;c.stage=Math.min(6,c.stage+1);c.accepted=true;
 const today=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short'});c.dates=c.dates||[];c.dates[c.stage]=today;
 if(c.stage>=6&&!c.xsell)c.xsell=c.scene==='bathroom'?'Bathroom revamp':c.scene==='basement'?'Basement paint and flooring':'Exterior repaint';
 if(c.stage>=6){const d=new Date();c.issued=d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});const v=new Date(d.getFullYear()+TIERS[c.tier].yrs,d.getMonth(),1);c.valid=v.toLocaleDateString('en-IN',{month:'short',year:'numeric'});toast('Warranty issued. Your QR is ready.')}
 saveCases();R.case()}
const A={
 go:v=>go(v),bell:()=>toast('You have no new alerts. Pre-monsoon check reminders appear here.'),help:()=>toast('Tip: capture the whole area, then a close-up of the stain.'),
 start:()=>{S.photos=[];S.sel=0;S.result=null;S.fromAnalysis=true;go('photos')},
 bookdirect:()=>{S.photos=[];S.result=null;S.fromAnalysis=false;go('book')},
 upload:()=>{if(S.photos.length>=3){toast('You can add up to 3 photos');return}$('#file').click()},
 demo:async()=>{S.photos=await Promise.all(['ceiling','joint','terrace'].map(demoPhoto));S.sel=0;S.ctx.where='Ceiling';R.photos()},
 sel:i=>{S.sel=+i;R.photos()},rm:(i,e)=>{S.photos.splice(+i,1);S.sel=0;R.photos()},zoom:v=>{S.zoom=+v;R.photos()},
 to:v=>{if(v==='next'||v==='details')S.fromAnalysis=true;go(v)},
 ctx:(k,v)=>{S.ctx[k]=v;R.details()},analyse:()=>analyse(),
 vt:v=>{S.draft.type=v;R.book()},dd:i=>{S.draft.date=+i;R.book()},sl:i=>{S.draft.slot=+i;R.book()},
 confirm:()=>newCase(),viewcase:()=>{closeSheet();go('case')},
 case:id=>{S.openCase=id;S.flipped=false;go('case')},flipcard:()=>{S.flipped=!S.flipped;$('#flip').classList.toggle('back',S.flipped)},
 joblog:()=>{const c=cases.find(x=>x.id===S.openCase);if(c)jobLog(c)},closesheet:closeSheet,
 adv:id=>advance(id),
 claim:id=>{const c=cases.find(x=>x.id===id);c.claim={id:'C-'+(100+Math.floor(Math.random()*800)),step:0};saveCases();toast('Claim raised. No paperwork needed.');R.case()},
 clinics:()=>openSheet(`<h3>Choose your AP Assure clinic</h3><p class="sub">Every case is handled by a dealer clinic near you.</p>${Object.keys(CLINICS).map(i=>{const k=CLINICS[i];return`<button class="card clc" style="width:100%;text-align:left;${i===S.clinic?'border-color:var(--orange);background:var(--orange-tint)':''}" data-act="pickclinic:${i}"><span class="clic">${ic('pin')}</span><span class="clt"><b>${esc(k.name)}</b><small>${esc(k.area)} · ${esc(k.dist)}</small></span>${i===S.clinic?ic('check'):''}</button>`}).join('')}<p class="sub" style="margin:8px 0 14px">Illustrative pilot clinics. If your area has no clinic yet, we connect you to your nearest BHPS dealer.</p><button class="btn ghost" data-act="closesheet">Close</button>`),
 pickclinic:i=>{S.clinic=i;closeSheet();if(R[cur])R[cur]()},
 dealer:()=>{S.dealer=S.clinic;go('dealer')},dealerpick:i=>{S.dealer=i;R.dealer()},
 techpick:(id,n)=>{const c=cases.find(x=>x.id===id);if(c){c.tech=n;saveCases()}R.dealer()},
 accept:id=>{const c=cases.find(x=>x.id===id);if(!c)return;c.accepted=true;saveCases();toast('Lead accepted. +'+PTS.lead+' points credited');R.dealer()},
 xs:id=>{const c=cases.find(x=>x.id===id);if(!c)return;c.xsellDone=true;saveCases();toast('Cross-sell followed up. +'+PTS.xsell+' points credited');R.dealer()},
 claimadv:id=>{const c=cases.find(x=>x.id===id);c.claim.step=Math.min(3,c.claim.step+1);saveCases();R.case()}
};
$('#phone').addEventListener('click',e=>{
 if(e.target===$('#sheet')){closeSheet();return}
 const el=e.target.closest('[data-act]');if(!el)return;
 if(el.classList.contains('rm')||e.target.closest('.rm')){const rm=e.target.closest('.rm');if(rm){e.stopPropagation();A.rm(rm.dataset.act.split(':')[1]);return}}
 const parts=el.dataset.act.split(':');const f=A[parts[0]];if(f)f(...parts.slice(1),e)});

/* ---------- boot ---------- */
loadCases();
setTimeout(()=>{if(cur==='splash')go('home')},2200);
</script>
</body></html>
